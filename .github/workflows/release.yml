# Сборка релиза: при пуше тега v* собирает программу под 6 систем и публикует их с SHA256SUMS.txt
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          VERSION="${GITHUB_REF_NAME#v}"
          build() {
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$3" .
          }
          build windows amd64 cwm-connector-windows-amd64.exe
          build windows arm64 cwm-connector-windows-arm64.exe
          build darwin arm64 cwm-connector-macos-arm64
          build darwin amd64 cwm-connector-macos-amd64
          build linux amd64 cwm-connector-linux-amd64
          build linux arm64 cwm-connector-linux-arm64
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
