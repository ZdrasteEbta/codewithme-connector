# Сборка релиза: при пуше тега v* собирает приложение под каждую систему и публикует с SHA256SUMS.txt
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CodeWithMe-IDE-windows-amd64.exe
          - os: macos-latest
            asset: CodeWithMe-IDE-macos-arm64.zip
          - os: macos-15-intel
            asset: CodeWithMe-IDE-macos-amd64.zip
          - os: ubuntu-22.04
            asset: CodeWithMe-IDE-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        if: runner.os != 'macOS' # тесты рассчитаны на Linux и Windows
        run: go vet ./... && go test ./...
      - name: Build helper
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""; [ "$RUNNER_OS" = Windows ] && EXT=".exe"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "codewithme-helper$EXT" .
      - name: Build app
        run: |
          pip install -r desktop/requirements.txt
          VERSION="${GITHUB_REF_NAME#v}" python desktop/build.py # на Windows ещё собирает запускалку из launcher/
      - name: Collect
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp desktop/dist/CodeWithMe-IDE.exe "out/${{ matrix.asset }}" ;;
            macOS) ditto -c -k --keepParent desktop/dist/CodeWithMe-IDE.app "out/${{ matrix.asset }}" ;;
            *) cp desktop/dist/CodeWithMe-IDE "out/${{ matrix.asset }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  publish:
    needs: build
    if: ${{ !cancelled() }} # сборка под одну систему не должна задерживать остальные
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
